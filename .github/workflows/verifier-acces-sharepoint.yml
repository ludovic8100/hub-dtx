# Vérification ponctuelle de l'accès SharePoint de l'application Azure du Hub.
# À lancer à la main depuis l'onglet Actions. Ne modifie rien.
name: Vérifier l'accès SharePoint

# Portee du jeton GitHub de ce workflow. Aucun de nos workflows n'ecrit
# dans le depot : ils lisent le code et parlent a Supabase, SharePoint ou
# Qlik. Sans cette ligne, le jeton porte les droits par defaut du depot,
# qui peuvent inclure l'ecriture.
permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest
    env:
      GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
      GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
      GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vérifier
        run: python scripts/verifier_acces_sharepoint.py
