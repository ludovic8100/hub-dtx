name: Optimize logos
# Portee du jeton GitHub de ce workflow. Aucun de nos workflows n'ecrit
# dans le depot : ils lisent le code et parlent a Supabase, SharePoint ou
# Qlik. Sans cette ligne, le jeton porte les droits par defaut du depot,
# qui peuvent inclure l'ecriture.
permissions:
  contents: read

on:
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow requests
      - run: python scripts/optimize_logos.py
