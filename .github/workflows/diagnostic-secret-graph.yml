name: Diagnostic - secret Microsoft Graph

# Outil de panne, lance a la main, a supprimer une fois le probleme regle.
#
# Il NE REVELE AUCUN SECRET : il n'imprime que des faits de FORME (longueur,
# ressemble-t-il a un identifiant, contient-il un tilde) et le code d'erreur
# renvoye par Microsoft. GitHub masque de toute facon toute valeur de secret
# qui apparaitrait dans le journal.
#
# Il existe parce que AADSTS7000215 ne dit pas LEQUEL des trois secrets est
# faux, ni s'il a bien ete enregistre. Deviner coute un aller-retour par
# hypothese ; mesurer en coute un seul.

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Environnement a diagnostiquer"
        type: choice
        options: [production, test]
        default: production

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'production' }}
    env:
      GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
      GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
      GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Forme des trois secrets, puis essai de jeton
        run: |
          python - <<'PY'
          import json, os, re, urllib.parse, urllib.request

          def forme(nom):
              v = os.environ.get(nom, "")
              if not v:
                  return f"{nom:22s} ABSENT"
              guid = bool(re.fullmatch(r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}", v))
              return (f"{nom:22s} longueur={len(v):3d}  "
                      f"ressemble a un identifiant (GUID)={'OUI' if guid else 'non'}  "
                      f"contient un tilde={'OUI' if '~' in v else 'non'}  "
                      f"espace au bord={'OUI' if v != v.strip() else 'non'}")

          print("=== FORME DES SECRETS (aucune valeur affichee) ===")
          for n in ("GRAPH_TENANT_ID", "GRAPH_CLIENT_ID", "GRAPH_CLIENT_SECRET"):
              print(forme(n))

          print()
          print("Rappel : une VALEUR de secret Azure fait ~40 caracteres et contient")
          print("presque toujours un tilde. Un ID de secret est un GUID de 36.")
          print()

          corps = urllib.parse.urlencode({
              "client_id": os.environ.get("GRAPH_CLIENT_ID", ""),
              "client_secret": os.environ.get("GRAPH_CLIENT_SECRET", ""),
              "scope": "https://graph.microsoft.com/.default",
              "grant_type": "client_credentials",
          }).encode()
          url = f"https://login.microsoftonline.com/{os.environ.get('GRAPH_TENANT_ID','')}/oauth2/v2.0/token"
          print("=== ESSAI DE JETON ===")
          try:
              with urllib.request.urlopen(urllib.request.Request(url, data=corps), timeout=30) as r:
                  d = json.loads(r.read().decode())
              import base64
              ch = d["access_token"].split(".")[1]; ch += "=" * (-len(ch) % 4)
              roles = sorted(json.loads(base64.urlsafe_b64decode(ch)).get("roles", []))
              print("JETON OBTENU. Autorisations portees :", ", ".join(roles) or "(aucune)")
          except urllib.error.HTTPError as e:
              d = json.loads(e.read().decode())
              print("REFUS :", d.get("error"), d.get("error_codes"))
              desc = d.get("error_description", "").split("Trace ID")[0].strip()
              print(desc)
              print()
              if 7000215 in (d.get("error_codes") or []):
                  print(">>> Le secret ne correspond pas a cette application.")
                  print(">>> Soit la valeur est fausse (ID colle a la place de la Valeur),")
                  print(">>> soit le secret a ete cree sur une AUTRE application Azure que")
                  print(">>> celle designee par GRAPH_CLIENT_ID.")
              if 7000222 in (d.get("error_codes") or []):
                  print(">>> Le secret est expire. Il faut en creer un nouveau.")
          PY

  # DEUXIEME SOURCE : les secrets du DEPOT, pas de l'environnement.
  #
  # Le job ci-dessus porte `environment: production` et ne lit donc QUE les
  # secrets de cet environnement. Si une nouvelle valeur a ete collee au niveau
  # du depot, elle est invisible pour lui — et le workflow continue d'utiliser
  # l'ancienne sans que rien ne le dise.
  #
  # Ce job-ci n'a pas d'environnement : il lit la source depot. Comparer les
  # deux formes repond en une fois a « ai-je colle au bon endroit ? ».
  depot:
    runs-on: ubuntu-latest
    env:
      GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
    steps:
      - name: Forme du secret cote DEPOT
        run: |
          python3 - <<'PY'
          import os, re
          v = os.environ.get("GRAPH_CLIENT_SECRET", "")
          print("=== SOURCE : SECRETS DU DEPOT (sans environnement) ===")
          if not v:
              print("GRAPH_CLIENT_SECRET  ABSENT au niveau du depot")
              print(">>> Normal si tout a ete deplace dans l'environnement production.")
          else:
              guid = bool(re.fullmatch(r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}", v))
              print(f"GRAPH_CLIENT_SECRET  longueur={len(v)}  "
                    f"ressemble a un identifiant (GUID)={'OUI' if guid else 'non'}  "
                    f"contient un tilde={'OUI' if '~' in v else 'non'}")
              print(">>> PRESENT au niveau du depot. Si sa forme differe de celle du job")
              print(">>> 'diagnostic', la nouvelle valeur a ete collee au MAUVAIS endroit :")
              print(">>> les workflows lisent l'environnement production, pas le depot.")
          PY
