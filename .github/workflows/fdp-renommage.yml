name: Fiches de paie — renommage

# Renomme les fiches de paie de COMPTA/DETAILS_EMPLOYES/FDP au format
# « AAAA.MM - CODE.pdf » (2026.02 - GGO.pdf).
#
# Le trigramme vient de collaborateurs.code, jamais d'une deduction sur le
# nom de l'employe. La periode vient du nom du fichier, jamais du contenu.
# Ce qui n'est pas lisible n'est pas renomme : il part dans la liste a
# verifier, affichee dans le journal.
#
# Seule ecriture dans SharePoint : le nom. Jamais de deplacement, jamais de
# suppression. Lancement a la main, essai a blanc par defaut.

# Portee du jeton GitHub de ce workflow. Aucun de nos workflows n'ecrit
# dans le depot : ils lisent le code et parlent a Supabase, SharePoint ou
# Qlik. Sans cette ligne, le jeton porte les droits par defaut du depot,
# qui peuvent inclure l'ecriture.
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      lot:
        description: "Nombre maximum de renommages (0 = tous)"
        type: string
        default: '0'
      dry_run:
        description: "Essai a blanc — affiche les renommages sans en faire aucun"
        type: boolean
        default: true
      target:
        description: "Environnement cible (base Supabase, pour les trigrammes)"
        type: choice
        options: [test, production]
        default: production

concurrency:
  group: fdp-renommage
  cancel-in-progress: false

jobs:
  renommer:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      APP_ENV: ${{ inputs.target }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL || (inputs.target == 'test' && 'https://lvdnzbhplnzuwdqtitdb.supabase.co' || '') }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
      GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
      GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
      LOT: ${{ inputs.lot }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
    steps:
      # GARDE-FOU : la production ne se lance que depuis main.
      #
      # Le 05/11, j'ai pousse une branche non fusionnee et lance un
      # workflow dessus : il a tourne avec les secrets de PRODUCTION.
      # Ce pas aurait arrete ca.
      #
      # C'est un ralentisseur, pas une serrure : qui peut ecrire dans le
      # depot peut retirer ces lignes dans sa propre branche. La serrure,
      # c'est GitHub > Settings > Environments > production >
      # Deployment branches > main. Celle-ci attrape les accidents.
      - name: Refuser la production depuis une branche
        if: ${{ github.ref != 'refs/heads/main' && (inputs.target == 'production' || inputs.target == '') }}
        run: |
          echo "::error::Ce workflow vise la PRODUCTION mais tourne sur ${{ github.ref }}."
          echo "::error::Fusionne dans main, ou relance avec target=test."
          exit 1
      
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # fdp_renommage.py lit la periode DANS la fiche : il lui faut pypdf.
      - run: pip install -r scripts/requirements.txt

      - name: Verifier les secrets
        run: |
          for s in GRAPH_TENANT_ID GRAPH_CLIENT_ID GRAPH_CLIENT_SECRET SUPABASE_SERVICE_KEY; do
            if [ -z "${!s}" ]; then echo "::error::Secret $s manquant"; exit 1; fi
          done
          echo "Cible: $APP_ENV - Lot: ${LOT:-tous} - Mode: ${DRY_RUN:+ESSAI A BLANC}${DRY_RUN:-RENOMMAGE REEL}"

      - name: Renommage
        run: python scripts/fdp_renommage.py
