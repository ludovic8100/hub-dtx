# Récupère un package de design déposé dans SharePoint DOWNLOAD et le publie
# comme artefact, pour qu'une session Claude puisse le lire.
#
# POURQUOI : le connecteur Microsoft 365 d'une session lit le texte, les PDF
# et les images, mais refuse les archives (« application/zip can't be read »).
# Les GitHub Actions, elles, ont déjà les accès Graph. Ce workflow fait le pont.
#
# NE MODIFIE RIEN : il télécharge, extrait, et publie. Aucune écriture
# SharePoint, aucune écriture en base.
#
# TEMPORAIRE : à supprimer une fois le design intégré.
name: Récupérer un package de design

# ECRITURE, et c'est l'exception : les images du package sont binaires.
# Le journal du run ne transporte que du texte, et l'hote des artefacts
# (blob.core.windows.net) est refuse par le proxy des sessions Claude. Le
# seul canal qui reste pour un .webp, c'est un commit.
#
# Porte volontairement etroite : une branche dediee, et uniquement les
# fichiers de public/ambiances/.
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      fichier:
        description: "Nom exact du fichier dans SharePoint DOWNLOAD"
        type: string
        required: true
        default: "DTX_Hub_Environnement_Complet_Claude_2026 (3).zip"
      branche_assets:
        description: "Branche ou deposer les images (vide = ne rien commiter)"
        type: string
        default: ''

jobs:
  recuperer:
    runs-on: ubuntu-latest
    # Les secrets Graph vivent dans l'environnement production, lui-même
    # limité à la branche main. Voir verifier-acces-sharepoint.yml.
    environment: production
    env:
      GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
      GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
      GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
      FICHIER: ${{ inputs.fichier }}
      SORTIE: package
    steps:
      - name: Refuser la production depuis une branche
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::Ce workflow utilise les secrets de PRODUCTION mais tourne sur ${{ github.ref }}."
          exit 1

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Télécharger et extraire
        run: python scripts/recuperer_package_design.py

      # L'hote des artefacts GitHub (blob.core.windows.net) est refuse par le
      # proxy des sessions Claude : « 403 Forbidden ». Le journal du run, lui,
      # passe par l'API REST et se lit sans probleme. On imprime donc les
      # fichiers de texte directement — c'est le seul canal qui marche.
      #
      # Borne volontairement : pas la demo de 1,5 Mo, pas le manifeste de
      # sommes de controle. Ce qui sert a comprendre et a integrer.
      - name: Afficher les textes dans le journal
        run: |
          python3 - <<'PY'
          import pathlib
          racine = pathlib.Path("package")
          motifs = [
            "**/00_LIRE_AVANT/*.md",
            "**/02_IMPLEMENTATION/**/*.css",
            "**/02_IMPLEMENTATION/**/*.json",
            "**/02_IMPLEMENTATION/**/*.ts",
            "**/02_IMPLEMENTATION/**/*.tsx",
            "**/02_IMPLEMENTATION/**/*.md",
            "**/03_ASSETS/decorations/*.svg",
          ]
          vus = set()
          for motif in motifs:
              for f in sorted(racine.glob(motif)):
                  if f in vus or not f.is_file():
                      continue
                  vus.add(f)
                  rel = f.relative_to(racine)
                  print(f"\n===== DEBUT {rel} ({f.stat().st_size} o) =====")
                  print(f.read_text(encoding="utf-8", errors="replace"))
                  print(f"===== FIN {rel} =====")
          print(f"\n{len(vus)} fichiers imprimes.")
          PY

      # Deux artefacts, et c'est volontaire : la session n'a pas besoin des
      # images pour lire un brief, et un artefact de 60 Mo coûte cher à
      # rapatrier. Le petit d'abord, le complet seulement si nécessaire.
      - name: Deposer les couvertures sur une branche
        if: ${{ inputs.branche_assets != '' }}
        env:
          BRANCHE: ${{ inputs.branche_assets }}
        run: |
          set -e
          mkdir -p public/ambiances
          # Les couvertures seules. Pas les logos : le Hub a deja les siens,
          # et le brief dit expressement de les preserver.
          find package -path '*03_ASSETS/covers/*' -name '*.webp' -exec cp {} public/ambiances/ \;
          ls -l public/ambiances/
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCHE"
          git add -f public/ambiances/
          git commit -m "Couvertures des cinq ambiances, depuis le package SharePoint" \
                     -m "Images binaires : ni le journal du run ni l'hote des artefacts ne peuvent les transporter jusqu'a une session Claude. Un commit est le seul canal qui reste." \
            || { echo "rien a commiter"; exit 0; }
          git push -f origin "$BRANCHE"

      - name: Publier les textes seuls
        uses: actions/upload-artifact@v4
        with:
          name: design-textes
          path: |
            package/**/*.txt
            package/**/*.md
            package/**/*.json
            package/**/*.css
            package/**/*.js
            package/**/*.cjs
            package/**/*.html
            package/**/*.svg
          if-no-files-found: warn
          retention-days: 7

      - name: Publier le package complet
        uses: actions/upload-artifact@v4
        with:
          name: design-complet
          path: package/
          retention-days: 7
