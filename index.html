<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynassur Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;400;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
  </head>
  <body>
    <div id="root"></div>
    <!-- Garde-fou configuration : une erreur [Hub] levée par src/config/env.js (ex. build de test
         sans VITE_SUPABASE_URL) s'affiche en clair au lieu d'une page blanche. -->
    <script>
      window.addEventListener('error', function (e) {
        var m = (e && e.message) || ''
        if (m.indexOf('[Hub]') === -1) return
        var r = document.getElementById('root')
        if (!r) return
        r.innerHTML = ''
        var box = document.createElement('div')
        box.style.cssText = 'font-family:sans-serif;max-width:640px;margin:15vh auto;padding:24px;border:2px solid #dc2626;border-radius:12px;background:#fef2f2;color:#7f1d1d'
        var h = document.createElement('h2'); h.textContent = 'Configuration incomplète'; h.style.margin = '0 0 8px'
        var t = document.createElement('p'); t.textContent = m.split('[Hub]').pop().trim(); t.style.margin = '0'
        var n = document.createElement('p'); n.textContent = 'Voir .env.example et les variables d’environnement du projet Vercel.'; n.style.cssText = 'margin:12px 0 0;font-size:13px;color:#991b1b'
        box.appendChild(h); box.appendChild(t); box.appendChild(n); r.appendChild(box)
      })
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
